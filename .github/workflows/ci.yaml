name: CI Workflow

on:
  push:
    branches: 
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: checkout code
      uses: actions/checkout@v4

    - name: set up python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: run tests
      run: |
        pytest _test.py

# CI Status:
# If all assertions pass, pytest exits with code 0. GitHub displays a green checkmark on your commit.
# If any assertion fails or an unhandled crash occurs, pytest exits with code 1.
#  GitHub halts the job and displays a red X.